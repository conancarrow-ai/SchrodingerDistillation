[project]
name = "sparse-dsb"
version = "0.0.1"
description = "Diffusion Schrodinger Bridge (IPF) training loop in JAX for the sparse-transformers models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax[cuda12]==0.11.2",
    "equinox==0.13.8",
    "optax>=0.2.3",
    "jaxtyping>=0.2.23",
    "numpy>=2.1",
    "pillow>=11",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "pytest>=8",
    "st",
    "z1t",
]

[dependency-groups]
validation = ["torch>=2.2"]

[tool.uv.sources]
st = { path = "sparse-transformers/research/st", editable = true }
z1t = { path = "sparse-transformers/research/z1t", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]
default-groups = ["validation"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sparse_dsb"]
